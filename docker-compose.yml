services:
  db:
    image: pgvector/pgvector:pg17
    container_name: docs-qa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsqa
      POSTGRES_PASSWORD: docsqa
      POSTGRES_DB: docsqa
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsqa -d docsqa"]
      interval: 5s
      timeout: 3s
      retries: 10
